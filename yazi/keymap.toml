# ==================== ГЛАВНЫЙ РЕЖИМ ====================
[mgr]

prepend_keymap = [
    # --------------------- Навигация ---------------------
    # J / K - прыжок на 3 строки (как у тебя map J 3j)
    { on = [ "J" ], run = "arrow 3" },
    { on = [ "K" ], run = "arrow -3" },

    # U / I - В начало и конец (твои map U bottom / I top)
    { on = [ "U" ], run = "arrow 99999999" }, # В самый низ
    { on = [ "I" ], run = "arrow -99999999" }, # В самый верх
    
    # l - ТОЛЬКО вход в папку. Если это файл - ничего не делает.
    { on = [ "l" ], run = [ "enter", "arrow -99999999" ] },
    
    # Enter - открытие файла (как map <enter> open)
    { on = [ "<Enter>" ], run = "open" },
    
    # Возврат назад (h)
    { on = [ "h" ], run = "leave" },

    # m / M - Листание результатов поиска (вместо n/N)
    { on = [ "m" ], run = "find_arrow" },
    { on = [ "M" ], run = "find_arrow --previous" },
    
    # --------------------- Операции с файлами ---------------------
    # x / X - Права доступа (через shell, чтобы не блокировать интерфейс)
    # block = false значит "не выходить в терминал"
    { on = [ "x" ], run = 'shell --confirm "chmod -x \"$@\""' },
    { on = [ "X" ], run = 'shell --confirm "chmod +x \"$@\""' },

    # --------------------- Создание (Input) ---------------------
    # n - Новый файл (права 644)
    { on = [ "n" ], run = "create" },
    # N - Новая папка (права 755)
    { on = [ "N" ], run = "create --dir" },
    
    # --------------------- Ссылки (Symlink) ---------------------
    # y - Относительная ссылка (на выделенные файлы)
    { on = [ "y" ], run = "link --relative" },
    # Y - Абсолютная ссылка
    { on = [ "Y" ], run = "link" },
    
    # t - Переименование
    { on = [ "t" ], run = "rename --cursor=before_ext" },

    # --------------------- Копирование / Вставка ---------------------
    { on = [ "c" ], run = "yank" },       # Copy
    { on = [ "C" ], run = "yank --cut" }, # Cut
    { on = [ "v" ], run = "paste" },      # Paste
    { on = [ "f" ], run = "toggle" },     # Выделение
    { on = [ "F" ], run = "select --all" },     # Снять все выделения

    # --------------------- Удаление ---------------------
    # d - Удаление в корзину (безопасное)
    { on = [ "d" ], run = "remove" },
    
    # D - Удаление навсегда (rm -rf) через shell
    { on = [ "D" ], run = 'shell --block --confirm "rm -rf \"$@\""' },

    # --------------------- Разное ---------------------
    # . - Скрытые файлы + прыжок наверх
    { on = [ "." ], run = [ "hidden toggle", "arrow -99999999" ] },
    
    # , - Посчитать размер (du -sh) и показать результат
    # block = true (ждем выполнения), confirm = true (ждем Enter, чтобы прочитать)
    # { on = [ "," ], run = 'shell --block --confirm "du -sh \"$@\""' },
    # , - Посчитать размер (du -csh) и показать через fzf (как popup)
    # --block: отдать управление fzf
    # du -csh: c=total (итог), s=summary (без потрохов), h=human (Мб/Гб)
    # fzf --no-sort: не перемешивать строки
    { on = [ "," ], run = 'shell --block "du -csh \"$@\" | fzf --no-sort --header=\"Disk Usage (ESC to exit)\""' },
    # q - Сброс (выделения, поиска, фильтра) - аналог Esc
    { on = [ "q" ], run = "escape" },
    
    # :q - Выход из программы (последовательное нажатие : затем q)
    { on = [ ":", "q" ], run = "quit" },
]
